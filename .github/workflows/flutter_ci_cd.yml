name: Flutter CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Install dependencies
        run: flutter pub get

      # ✅ IST Time + Dynamic Name
      - name: Set build name
        run: echo "BUILD_NAME=Dev_shop_virtualKart_$(TZ='Asia/Kolkata' date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release

      # ✅ Install latest Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@latest
          firebase --version

      # ✅ Upload to Firebase with release name
      - name: Upload to Firebase App Distribution
        id: firebase_upload
        run: |
          OUTPUT=$(firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "internal_tester" \
            --release-name "${BUILD_NAME}" \
            --release-notes "🚀 Build: ${BUILD_NAME}")
          echo "$OUTPUT"

          # Extract download URL
          DOWNLOAD_URL=$(echo "$OUTPUT" | grep -o 'https://firebaseappdistribution\.googleapis\.com/[^ ]*')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      # ✅ Slack Notification
      - name: Notify Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 *New APK Build Available*\n📦 Name: ${BUILD_NAME}\n📥 Download: ${DOWNLOAD_URL}\n👤 Triggered by: ${GITHUB_ACTOR}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}