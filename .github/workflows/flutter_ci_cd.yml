name: Flutter CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Install dependencies
        run: flutter pub get

      # ✅ Step 1: Generate dynamic name
      - name: Set build name
        run: echo "BUILD_NAME=Dev_shop_virtualKart_$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release

      # ✅ Step 2: Rename APK
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${BUILD_NAME}.apk

      # ✅ Step 3: Upload renamed APK
      - name: Upload to Firebase App Distribution
        id: firebase_upload
        run: |
          npm install -g firebase-tools
          OUTPUT=$(firebase appdistribution:distribute build/app/outputs/flutter-apk/${BUILD_NAME}.apk --app "${{ secrets.FIREBASE_APP_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}" --groups "internal_tester" --release-notes "${BUILD_NAME}")
          echo "$OUTPUT"
          # Extract Firebase download URL
          DOWNLOAD_URL=$(echo "$OUTPUT" | grep -o 'https://firebaseappdistribution\.googleapis\.com/[^ ]*')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      # ✅ Step 4: Send Slack notification
      - name: Notify Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 New APK Build: *${BUILD_NAME}*\n📥 Download here: ${DOWNLOAD_URL}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}