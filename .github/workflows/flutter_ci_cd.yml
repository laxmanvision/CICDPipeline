name: Flutter CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5️⃣ Generate IST timestamp + dynamic build name
      - name: Set build name
        run: |
          echo "BUILD_NAME=Dev_shop_virtualKart_$(TZ='Asia/Kolkata' date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV
          echo "Build name: $BUILD_NAME"

      # 6️⃣ Build APK
      - name: Build APK
        run: flutter build apk --release

      # 7️⃣ Rename APK locally
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${BUILD_NAME}.apk
          echo "APK renamed to ${BUILD_NAME}.apk"

      # 8️⃣ Install latest Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@latest
          hash -r
          firebase --version

      # 9️⃣ Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        id: firebase_upload
        run: |
          OUTPUT=$(firebase appdistribution:distribute build/app/outputs/flutter-apk/${BUILD_NAME}.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "internal_tester" \
            --release-notes "🚀 Build: ${BUILD_NAME}")
          echo "$OUTPUT"

          # Extract Firebase download URL
          DOWNLOAD_URL=$(echo "$OUTPUT" | grep -o 'https://firebaseappdistribution\.googleapis\.com/[^ ]*')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "Firebase download URL: $DOWNLOAD_URL"

      # 🔟 Send Slack notification
      - name: Notify Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 *New APK Build Available*\n📦 Name: ${BUILD_NAME}\n📥 Download: ${DOWNLOAD_URL}\n👤 Triggered by: ${GITHUB_ACTOR}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}